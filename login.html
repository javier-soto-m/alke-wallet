<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Inicio de sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>

<body class="d-flex justify-content-center align-items-center min-vh-100 bg-light">

    <main class="card p-4 shadow app-card">

        <header>
            <h2 class="text-center mb-4">Inicio de sesión</h2>
        </header>

        <form id="loginForm">

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Ingrese su correo" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="Ingrese su contraseña" required>
            </div>

            <!-- Acá se muestran los mensajes de éxito o error -->
            <div id="mensaje"></div>

            <button type="submit" class="btn btn-primary w-100 mb-2">
                Iniciar sesión
            </button>

        </form>

        <p class="text-center text-secondary mb-0" style="font-size:0.85rem;">
            Demo: usuario@wallet.com / 123456
        </p>

    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="app.js"></script>

</body>

</html>
