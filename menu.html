<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Menú Principal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="menu.html">Alke Wallet</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false"
                aria-label="Mostrar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="menu.html">Menú</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="deposit.html">Depositar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sendmoney.html">Enviar dinero</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="transactions.html">Movimientos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="d-flex justify-content-center align-items-center py-4" style="min-height: calc(100vh - 56px);">

        <main class="card p-4 shadow app-card">

            <header>
                <h2 class="text-center mb-4">Menú Principal</h2>
            </header>

            <section class="text-center mb-4" aria-label="Saldo disponible">
                <p class="mb-1">Saldo disponible</p>
                <h3 class="text-success" id="saldo">$1000000</h3>
            </section>

            <nav aria-label="Acciones principales">
                <div class="d-flex gap-2 mb-2">
                    <a href="deposit.html" id="btnDepositar" class="btn btn-primary flex-fill">
                        Depositar
                    </a>

                    <a href="sendmoney.html" id="btnEnviar" class="btn btn-primary flex-fill">
                        Enviar Dinero
                    </a>
                </div>

                <a href="transactions.html" id="btnMovimientos" class="btn btn-primary w-100">
                    Últimos movimientos
                </a>
            </nav>

            <!-- Acá aparece la leyenda "Redirigiendo a..." -->
            <div id="leyenda" class="mt-3"></div>

        </main>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- JS de Bootstrap (necesario para el navbar responsive) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="app.js"></script>

</body>

</html>
