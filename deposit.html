<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Depositar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="menu.html">Alke Wallet</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false"
                aria-label="Mostrar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="menu.html">Menú</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="deposit.html">Depositar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sendmoney.html">Enviar dinero</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="transactions.html">Movimientos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="d-flex justify-content-center align-items-center py-4" style="min-height: calc(100vh - 56px);">

    <main class="card p-4 shadow app-card">

        <header>
            <h2 class="text-center mb-2">Monto a depositar</h2>
            <p class="text-center mb-4">Saldo actual: <span id="saldoActual" class="fw-bold text-success"></span></p>
        </header>

        <form id="formDeposito">

            <div class="mb-3">
                <label for="monto" class="form-label">Monto a depositar</label>
                <input type="number" id="monto" class="form-control" placeholder="Ingrese el monto" min="1" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-2">
               Realizar depósito
            </button>

        </form>

        <!-- Leyenda con el monto depositado -->
        <div id="montoDepositado"></div>

        <!-- Alertas de Bootstrap generadas dinámicamente con jQuery -->
        <div id="alert-container"></div>

        <a href="menu.html" id="btnMenu" class="btn btn-secondary w-100">
            Ir al Menú Principal
        </a>

    </main>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- JS de Bootstrap (necesario para el navbar responsive) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="app.js"></script>

</body>

</html>
