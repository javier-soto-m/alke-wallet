<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Últimos Movimientos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="menu.html">Alke Wallet</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false"
                aria-label="Mostrar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="menu.html">Menú</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="deposit.html">Depositar</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sendmoney.html">Enviar dinero</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="transactions.html">Movimientos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="d-flex justify-content-center align-items-center py-4" style="min-height: calc(100vh - 56px);">

    <main class="card p-4 shadow app-card">

        <header>
            <h2 class="text-center mb-4">Últimos Movimientos</h2>
        </header>

        <section aria-label="Historial de movimientos">
            <form class="mb-3">
                <label for="filtroTipo" class="form-label">Filtrar por tipo de movimiento</label>
                <select id="filtroTipo" class="form-select">
                    <option value="todos">Todos</option>
                    <option value="Depósito">Depósito</option>
                    <option value="Envío">Envío</option>
                </select>
            </form>

            <!-- La lista de movimientos se completa desde JS -->
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th scope="col">Movimiento</th>
                        <th scope="col" class="text-end">Monto</th>
                    </tr>
                </thead>
                <tbody id="listaMovimientos"></tbody>
            </table>
        </section>

        <a href="menu.html" class="btn btn-secondary w-100">
            Volver al Menú Principal
        </a>

    </main>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- JS de Bootstrap (necesario para el navbar responsive) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="app.js"></script>
</body>

</html>
